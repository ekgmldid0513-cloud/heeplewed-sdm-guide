<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>히플웨딩 | 나의 스드메 취향 찾기</title>
<meta name="description" content="히플웨딩 다희 플래너와 함께 나에게 꼭 맞는 스튜디오·드레스·메이크업·헤어 스타일을 찾아보세요." />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app" id="app">
  <div class="progress-wrap" id="progressWrap" style="display:none;">
    <div class="progress-bar"><div id="progressFill" style="width:0%"></div></div>
    <div class="progress-label"><span id="progressText"></span><span id="progressPct"></span></div>
  </div>
  <div id="content"></div>
  <div class="nav-row" id="navRow" style="display:none;">
    <button class="btn btn-ghost" id="prevBtn">이전</button>
    <button class="btn btn-primary" id="nextBtn">다음</button>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button class="close-x" id="lightboxClose">✕</button>
  <img id="lightboxImg" src="" alt="" />
</div>
<div class="toast" id="toast"></div>

<!-- Firebase SDK (compat 버전 - 별도 빌드 도구 없이 스크립트 태그로 사용) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="common.js"></script>
<script src="seed-data.js"></script>
<script>
/* ============================================================
   히플웨딩 스드메 취향 찾기 — 고객용 8단계 페이지
   ============================================================ */

const STEP_ORDER = ["intro", "shootConcept", "studio", "dress", "makeup", "hair", "budget", "summary"];
const FLOW_STEPS = ["shootConcept", "studio", "dress", "makeup", "hair", "budget"]; // 진행바에 표시되는 6단계
const STORAGE_KEY = "heeple_sdme_state_v1";

let vendors = { studios: [], shootConcepts: [], dresses: [], dressShops: [], makeup: [], hair: [] };

function defaultState() {
  return {
    step: "intro",
    shootConceptSelected: [],
    likedShootConcepts: {},
    studioFilters: { peopleBg: null, space: null, rooms: [], product: null, priceTier: [] },
    likedStudios: {},
    dressFilters: { material1: [], material2: [], material3: [], topLine: [], skirtLine: [] },
    dressExtra: { etcKeyword: [], shootColors: [] },
    likedDresses: {},
    makeupChoice: null,
    likedMakeup: {},
    hairSelection: { categoryKey: null, subKey: null },
    budgetChoice: null,
    note: "",
    linkId: null,
  };
}

let state = loadLocal() || defaultState();

function loadLocal() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const saved = JSON.parse(raw);
    return saved ? mergeWithDefaults(saved) : null;
  } catch (e) { return null; }
}

// 예전 버전에서 저장된 localStorage 데이터(새 필드가 없는 구버전 state)를 열어도
// 안전하게 동작하도록, 기본값에 저장된 값을 덧씌워서 빠진 필드를 채워줍니다.
function mergeWithDefaults(saved) {
  const def = defaultState();
  const merged = { ...def, ...saved };
  merged.studioFilters = { ...def.studioFilters, ...(saved.studioFilters || {}) };
  merged.dressFilters = { ...def.dressFilters, ...(saved.dressFilters || {}) };
  merged.dressExtra = { ...def.dressExtra, ...(saved.dressExtra || {}) };
  merged.hairSelection = { ...def.hairSelection, ...(saved.hairSelection || {}) };
  merged.shootConceptSelected = saved.shootConceptSelected || [];
  merged.likedShootConcepts = saved.likedShootConcepts || {};
  merged.likedStudios = saved.likedStudios || {};
  merged.likedDresses = saved.likedDresses || {};
  merged.likedMakeup = saved.likedMakeup || {};
  return merged;
}
function saveLocal() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1600);
}
function openLightbox(url) {
  document.getElementById("lightboxImg").src = url;
  document.getElementById("lightbox").classList.add("open");
}
document.getElementById("lightboxClose").onclick = () => document.getElementById("lightbox").classList.remove("open");
document.getElementById("lightbox").onclick = (e) => { if (e.target.id === "lightbox") e.target.classList.remove("open"); };

/* ---------------- 데이터 로드 ---------------- */

async function loadVendors() {
  try {
    if (!window.FIREBASE_READY) throw new Error("firebase not configured yet");
    const snap = await db.ref("/").once("value");
    const val = snap.val() || {};
    vendors.studios = toArray(val.studios);
    vendors.shootConcepts = toArray(val.shootConcepts);
    vendors.dresses = toArray(val.dresses);
    vendors.makeup = toArray(val.makeup);
    vendors.hair = toArray(val.hair);
    if (!vendors.studios.length && !vendors.dresses.length && !vendors.makeup.length) throw new Error("empty db");
  } catch (e) {
    console.warn("[안내] Firebase 데이터를 불러오지 못해 샘플 데이터로 대체합니다.", e.message);
    vendors.studios = SAMPLE_VENDORS.studios.map((s, i) => ({ id: "sample_s" + i, ...s }));
    vendors.shootConcepts = SAMPLE_VENDORS.shootConcepts.map((c, i) => ({ id: "sample_sc" + i, ...c }));
    vendors.dresses = SAMPLE_VENDORS.dresses.map((d, i) => ({ id: "sample_d" + i, ...d }));
    vendors.makeup = SAMPLE_VENDORS.makeup.map((m, i) => ({ id: "sample_m" + i, ...m }));
    vendors.hair = SAMPLE_VENDORS.hair.map((h, i) => ({ id: "sample_h" + i, ...h }));
  }
}

/* ---------------- 라우팅 / 네비게이션 ---------------- */

function goStep(step) {
  state.step = step;
  saveLocal();
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function goNext() {
  const idx = STEP_ORDER.indexOf(state.step);
  if (idx < STEP_ORDER.length - 1) goStep(STEP_ORDER[idx + 1]);
}
function goPrev() {
  const idx = STEP_ORDER.indexOf(state.step);
  if (idx > 0) goStep(STEP_ORDER[idx - 1]);
}

function updateChrome() {
  const flowIdx = FLOW_STEPS.indexOf(state.step);
  const progressWrap = document.getElementById("progressWrap");
  const navRow = document.getElementById("navRow");
  if (flowIdx >= 0) {
    progressWrap.style.display = "block";
    const pct = Math.round(((flowIdx + 1) / FLOW_STEPS.length) * 100);
    document.getElementById("progressFill").style.width = pct + "%";
    document.getElementById("progressText").textContent = `STEP ${flowIdx + 1} / ${FLOW_STEPS.length}`;
    document.getElementById("progressPct").textContent = pct + "%";
  } else {
    progressWrap.style.display = "none";
  }
  if (state.step === "intro") {
    navRow.style.display = "none";
  } else {
    navRow.style.display = "flex";
    document.getElementById("prevBtn").style.visibility = "visible";
    document.getElementById("nextBtn").style.visibility = (state.step === "budget" || state.step === "summary") ? "hidden" : "visible";
  }
}

/* ---------------- 렌더 디스패처 ---------------- */

function render() {
  const c = document.getElementById("content");
  updateChrome();
  if (state.step === "intro") c.innerHTML = renderIntro();
  else if (state.step === "shootConcept") c.innerHTML = renderShootConcept();
  else if (state.step === "studio") c.innerHTML = renderStudio();
  else if (state.step === "dress") c.innerHTML = renderDress();
  else if (state.step === "makeup") c.innerHTML = renderMakeup();
  else if (state.step === "hair") c.innerHTML = renderHair();
  else if (state.step === "budget") c.innerHTML = renderBudget();
  else if (state.step === "summary") c.innerHTML = renderSummary();
  bindStepEvents();
}

/* ================= 1. 인트로 ================= */

function renderIntro() {
  return `
  <div class="intro">
    <span class="intro-badge">HEEPLE WEDDING · 동행플래너 다희</span>
    <h1>스드메, 고르다 보면<br/>내가 뭘 원하는지도 헷갈리시죠?</h1>
    <div class="quote-block">
      <p>"보다보니 비슷해서 내가 원하는 게 뭔지조차 헷갈려"</p>
      <p>"나는 이런 걸 원하는데, 어느 업체를 가야 이런 촬영이 가능한 거지?"</p>
      <p>"어떤 샵을 가야 효율적일까?"</p>
    </div>
    <p class="signature-line">
      이런 고민만 하다 보면, 설레는 마음으로 즐겨야 할 스드메가<br/>너무 어렵게만 느껴지시죠.<br/><br/>
      9년 동안 플래너로 신부님들 옆에서<br/>
      신부님들의 목소리를 듣고 함께 고민하며<br/>
      제가 직접 만들었습니다.
    </p>
    <div class="goal-list">
      <div class="goal-item">✓ 나의 진짜 취향 알아가기</div>
      <div class="goal-item">✓ 나를 더 빛내줄 스타일 찾기</div>
      <div class="goal-item">✓ 후회없는 나의 스타일 만들기</div>
    </div>
    <div class="credentials">
      드레스 현장동행 경력 9년차 · 메이크업 자격증 보유<br/>
      스튜디오 현장 동행 및 신부님들의 실제 만족도와 결과물을 지켜봐온 입장에서,<br/>
      하나하나 고심 끝에 신부님의 입장 + 실제 현실적인 부분까지 고려해서 만든 가이드입니다.
    </div>
    <p class="closing">지금부터 저와 함께 차근차근,<br/>정말 우리만의 최적의 스타일링을 찾아가보아요!</p>
    ${localStorage.getItem(STORAGE_KEY) && state.step === "intro" && hasAnyProgress() ? `
      <button class="btn btn-primary" id="resumeBtn" style="margin-bottom:10px;">이어서 계속하기</button>
      <button class="btn btn-ghost" id="restartBtn" style="width:100%;">처음부터 다시 시작하기</button>
    ` : `<button class="btn btn-primary" id="startBtn">시작하기 →</button>`}
  </div>`;
}
function hasAnyProgress() {
  return state.shootConceptSelected.length || state.studioFilters.peopleBg || (state.likedStudios && Object.keys(state.likedStudios).length) ||
    state.dressFilters.material1.length || state.makeupChoice || state.budgetChoice;
}

/* ================= 2. 스튜디오 ================= */

function filterStudios() {
  const f = state.studioFilters;
  return vendors.studios.filter((s) => {
    if (f.peopleBg && !(s.peopleBg || []).includes(f.peopleBg)) return false;
    if (f.space && !(s.space || []).includes(f.space)) return false;
    if (f.product && !(s.product || []).includes(f.product)) return false;
    if (f.rooms.length && !f.rooms.some((r) => (s.rooms || []).includes(r))) return false;
    if (f.priceTier.length) {
      const tiers = studioPriceTiers(Number(s.price) || 0);
      if (!f.priceTier.some((t) => tiers.includes(t))) return false;
    }
    return true;
  });
}

function renderStudio() {
  const f = state.studioFilters;
  const results = filterStudios();
  const singleGroup = (title, key, options) => `
    <div class="option-group">
      <div class="option-group-title">${title}</div>
      ${options.map((o) => `
        <div class="option-card ${f[key] === o.key ? "selected" : ""}" data-act="studio-single" data-key="${key}" data-val="${o.key}">
          <span class="dot">${f[key] === o.key ? "✓" : ""}</span>${escapeHtml(o.label)}
        </div>`).join("")}
    </div>`;

  return `
    <div class="step">
      <div class="step-eyebrow">STEP 2 · 스드메 선정하기</div>
      <div class="step-title">우리에게 맞는 웨딩 스튜디오 찾기</div>
      <div class="step-desc">내가 남기고 싶은 사진이 어떤 건지 고민해보세요!</div>
      <div class="notice-box">마음에 드는 스튜디오를 골라 플래너에게 전달해주시면, 상담 시 더 디테일한 각 스튜디오별 장/단점과 견적을 알려드릴게요!</div>

      ${singleGroup("1. 인물 &amp; 배경 비중", "peopleBg", TAGS.studio.peopleBg)}
      ${singleGroup("2. 공간적 특성", "space", TAGS.studio.space)}

      <div class="option-group">
        <div class="option-group-title">3. 촬영 가능 공간 <span class="tag-hint">중복 선택가능</span></div>
        <div class="chip-wrap">
          ${TAGS.studio.rooms.map((r) => `<div class="chip ${f.rooms.includes(r) ? "selected" : ""}" data-act="studio-multi" data-key="rooms" data-val="${escapeHtml(r)}">${escapeHtml(r)}</div>`).join("")}
        </div>
      </div>

      ${singleGroup("4. 촬영 상품", "product", TAGS.studio.product)}

      <div class="option-group">
        <div class="option-group-title">5. 금액대 <span class="tag-hint">중복선택가능</span></div>
        <div class="chip-wrap">
          ${TAGS.studio.priceTier.map((t) => `<div class="chip ${f.priceTier.includes(t.key) ? "selected" : ""}" data-act="studio-multi" data-key="priceTier" data-val="${t.key}">${escapeHtml(t.label)}</div>`).join("")}
        </div>
      </div>

      <div class="result-count">조건에 맞는 스튜디오 ${results.length}곳</div>
      <div class="card-grid">
        ${results.map((s) => renderStudioCard(s)).join("") || `<div class="summary-empty">조건에 맞는 스튜디오를 찾고 있어요. 위 항목을 선택해보세요!</div>`}
      </div>
    </div>`;
}

function renderStudioCard(s) {
  const liked = !!state.likedStudios[s.id];
  const imgs = Array.isArray(s.images) ? s.images : [];
  return `
    <div class="vendor-card-wrap">
      <button class="like-btn ${liked ? "liked" : ""}" data-act="like-studio" data-id="${s.id}">${liked ? "♥" : "♡"}</button>
      <div class="vendor-card">
        <div class="img-scroll">
          ${(imgs.length ? imgs : [{ url: "" }]).map((im) => `<img src="${im.url}" data-act="zoom" loading="lazy" />`).join("")}
        </div>
        <div class="info">
          <div class="name">${escapeHtml(s.name || "")}</div>
          <div class="meta">${(s.rooms || []).slice(0, 3).map(escapeHtml).join(" · ")}</div>
        </div>
      </div>
    </div>`;
}

/* ================= 1. 웨딩촬영 컨셉 둘러보기 ================= */

function filterShootConcepts() {
  const sel = state.shootConceptSelected;
  if (!sel.length) return [];
  return vendors.shootConcepts.filter((sc) => (sc.tags || []).some((t) => sel.includes(t)));
}

function shootConceptHashtags(im) {
  const tags = [...(im.tags || [])];
  if (im.studioName) tags.push(im.studioName);
  return tags.map((t) => "#" + t.replace(/\s+/g, "")).join(" ");
}

function renderShootConcept() {
  const sel = state.shootConceptSelected;
  const results = filterShootConcepts();
  return `
    <div class="step">
      <div class="step-eyebrow">STEP 1 · 스드메 선정하기</div>
      <div class="step-title">웨딩촬영 컨셉, 어떤 스타일들이 있는지부터 알려드릴게요!</div>
      <div class="step-desc">아래 태그를 선택하시면 해당 스타일의 사진들이 나타납니다. 그 안에서 신부님의 취향을 차근차근 찾아가보세요!</div>
      <div class="notice-box">기존 스튜디오를 고르기 전에, 웨딩촬영이 가능한 컨셉이 어떤 것들이 있는지 먼저 파악하고 본인의 취향을 알아가시라고 만든 페이지예요. 태그는 여러 개 눌러서 함께 보실 수 있어요!</div>

      <div class="chip-wrap">
        ${TAGS.shootConcept.map((t) => `<div class="chip ${sel.includes(t) ? "selected" : ""}" data-act="shootconcept-toggle" data-val="${escapeHtml(t)}">${escapeHtml(t)}</div>`).join("")}
      </div>

      <div class="masonry">
        ${results.map((im) => renderLikeableImage(im, "shootConcept", shootConceptHashtags(im))).join("") || `<div class="summary-empty">${sel.length ? "곧 시안이 업데이트될 예정이에요." : "위 태그를 선택하면 시안이 보여요."}</div>`}
      </div>
    </div>`;
}

function renderLikeableImage(im, type, captionText) {
  const bucket = type === "shootConcept" ? state.likedShootConcepts : type === "dress" ? state.likedDresses : state.likedMakeup;
  const liked = !!bucket[im.id];
  return `
    <div class="masonry-item">
      <button class="like-btn ${liked ? "liked" : ""}" data-act="like-${type}" data-id="${im.id}">${liked ? "♥" : "♡"}</button>
      <img src="${im.imageUrl}" data-act="zoom" loading="lazy" />
      ${captionText ? `<div class="tag-strip hashtag-strip">${escapeHtml(captionText)}</div>` : ""}
    </div>`;
}

/* ================= 4. 드레스 ================= */

function filterDressesMain() {
  const f = state.dressFilters;
  return vendors.dresses.filter((d) => {
    if (d.type !== "본식") return false;
    if (f.material1.length && !f.material1.some((v) => (d.material1 || []).includes(v))) return false;
    if (f.material2.length && !f.material2.some((v) => (d.material2 || []).includes(v))) return false;
    if (f.material3.length && !f.material3.some((v) => (d.material3 || []).includes(v))) return false;
    if (f.topLine.length && !f.topLine.some((v) => (d.topLine || []).includes(v))) return false;
    if (f.skirtLine.length && !f.skirtLine.some((v) => (d.skirtLine || []).includes(v))) return false;
    return true;
  });
}
function filterDressExtra() {
  const e = state.dressExtra;
  if (!e.etcKeyword.length && !e.shootColors.length) return [];
  return vendors.dresses.filter((d) => {
    const kw = e.etcKeyword.length ? e.etcKeyword.some((v) => (d.etcKeyword || []).includes(v)) : false;
    const cl = e.shootColors.length ? e.shootColors.some((v) => (d.shootColors || []).includes(v)) : false;
    return kw || cl;
  });
}

function dressChipGroup(title, key, options, multi) {
  const sel = state.dressFilters[key] || state.dressExtra[key];
  return `
    <div class="option-group">
      <div class="option-group-title">${title}</div>
      <div class="chip-wrap">
        ${options.map((o) => `<div class="chip ${sel.includes(o) ? "selected" : ""}" data-act="${multi ? "dress-extra" : "dress-single"}" data-key="${key}" data-val="${escapeHtml(o)}">${escapeHtml(o)}</div>`).join("")}
      </div>
    </div>`;
}

function dressHashtags(d) {
  const tags = [];
  ["material1", "material2", "material3", "topLine", "skirtLine", "etcKeyword", "shootColors"].forEach((k) => {
    (d[k] || []).forEach((v) => tags.push(v));
  });
  tags.push(d.shopName);
  tags.push(dressPriceTierLabel(Number(d.shopPrice) || 0));
  return tags.filter(Boolean).map((t) => "#" + t.replace(/\s+/g, "")).join(" ");
}

function renderDressCard(d) {
  const liked = !!state.likedDresses[d.id];
  return `
    <div class="masonry-item">
      <button class="like-btn ${liked ? "liked" : ""}" data-act="like-dress" data-id="${d.id}">${liked ? "♥" : "♡"}</button>
      <img src="${d.imageUrl}" data-act="zoom" loading="lazy" />
      <div class="tag-strip hashtag-strip">${escapeHtml(dressHashtags(d))}</div>
    </div>`;
}

function renderDress() {
  const mainResults = filterDressesMain();
  const extraResults = filterDressExtra();
  return `
    <div class="step">
      <div class="step-eyebrow">STEP 3 · 스드메 선정하기</div>
      <div class="step-title">내가 원하는 드레스 스타일 찾기</div>
      <div class="notice-box">해당 페이지를 참고해서 마음에 드는 시안을 골라 플래너에게 전달해주시면, 두 분께서 희망하시는 예산에 맞는 샵으로 추천 드릴게요!</div>

async function generateLink() {
  const btn = document.getElementById("genLinkBtn") || document.getElementById("makeLinkBtn");
  if (btn) { btn.disabled = true; btn.textContent = "저장 중..."; }
  const payload = {
    createdAt: Date.now(),
    shootConceptSelected: state.shootConceptSelected,
    likedShootConcepts: state.likedShootConcepts,
    studioFilters: state.studioFilters,
    likedStudios: state.likedStudios,
    dressFilters: state.dressFilters,
    dressExtra: state.dressExtra,
    likedDresses: state.likedDresses,
    makeupChoice: state.makeupChoice,
    likedMakeup: state.likedMakeup,
    budgetChoice: state.budgetChoice,
    note: state.note || "",
  };
  try {
    if (!window.FIREBASE_READY) throw new Error("no firebase");
    const ref = state.linkId ? db.ref("responses/" + state.linkId) : db.ref("responses").push();
    await ref.set(payload);
    state.linkId = ref.key;
  } catch (e) {
    console.warn("[안내] Firebase 미연결 상태라 임시 로컬 링크로 대체합니다.", e.message);
    state.linkId = state.linkId || uid("local");
    try { localStorage.setItem("heeple_sdme_response_" + state.linkId, JSON.stringify(payload)); } catch (_) {}
  }
  saveLocal();
  goStep("summary");
  showToast("링크가 생성되었어요!");
}

/* ---------------- 이벤트 바인딩 ---------------- */

function bindStepEvents() {
  document.querySelectorAll('[data-act="zoom"]').forEach((el) => el.addEventListener("click", () => openLightbox(el.src)));
  document.querySelectorAll('[data-act="scroll-to"]').forEach((el) => el.addEventListener("click", () => {
    const t = document.getElementById(el.dataset.target);
    if (t) t.scrollIntoView({ behavior: "smooth", block: "start" });
  }));

  const startBtn = document.getElementById("startBtn");
  if (startBtn) startBtn.addEventListener("click", async () => {
    startBtn.textContent = "불러오는 중...";
    await loadVendors();
    goNext();
  });
  const resumeBtn = document.getElementById("resumeBtn");
  if (resumeBtn) resumeBtn.addEventListener("click", async () => { await loadVendors(); goStep(state.step === "intro" ? "shootConcept" : state.step); });
  const restartBtn = document.getElementById("restartBtn");
  if (restartBtn) restartBtn.addEventListener("click", async () => { state = defaultState(); saveLocal(); await loadVendors(); goNext(); });

  document.querySelectorAll('[data-act="studio-single"]').forEach((el) => el.addEventListener("click", () => {
    const { key, val } = el.dataset;
    state.studioFilters[key] = state.studioFilters[key] === val ? null : val;
    saveLocal(); render();
  }));
  document.querySelectorAll('[data-act="studio-multi"]').forEach((el) => el.addEventListener("click", () => {
    const { key, val } = el.dataset;
    const arr = state.studioFilters[key];
    const i = arr.indexOf(val);
    if (i >= 0) arr.splice(i, 1); else arr.push(val);
    saveLocal(); render();
  }));
  document.querySelectorAll('[data-act="like-studio"]').forEach((el) => el.addEventListener("click", (e) => {
    e.stopPropagation();
    const id = el.dataset.id;
    const s = vendors.studios.find((x) => x.id === id);
    if (state.likedStudios[id]) delete state.likedStudios[id];
    else state.likedStudios[id] = { name: s.name, imageUrl: (Array.isArray(s.images) && s.images[0] && s.images[0].url) || "" };
    saveLocal(); render();
  }));

  document.querySelectorAll('[data-act="shootconcept-toggle"]').forEach((el) => el.addEventListener("click", () => {
    const val = el.dataset.val;
    const arr = state.shootConceptSelected;
    const i = arr.indexOf(val);
    if (i >= 0) arr.splice(i, 1); else arr.push(val);
    saveLocal(); render();
  }));
  document.querySelectorAll('[data-act="like-shootConcept"]').forEach((el) => el.addEventListener("click", (e) => {
    e.stopPropagation();
    const id = el.dataset.id;
    const c = vendors.shootConcepts.find((x) => x.id === id);
    if (state.likedShootConcepts[id]) delete state.likedShootConcepts[id];
    else state.likedShootConcepts[id] = { tags: c.tags, studioName: c.studioName || "", imageUrl: c.imageUrl };
    saveLocal(); render();
  }));

  document.querySelectorAll('[data-act="dress-single"]').forEach((el) => el.addEventListener("click", () => {
    const { key, val } = el.dataset;
    const arr = state.dressFilters[key];
    state.dressFilters[key] = arr.includes(val) ? [] : [val];
    saveLocal(); render();
  }));
  document.querySelectorAll('[data-act="dress-extra"]').forEach((el) => el.addEventListener("click", () => {
    const { key, val } = el.dataset;
    const arr = state.dressExtra[key];
    const i = arr.indexOf(val);
    if (i >= 0) arr.splice(i, 1); else arr.push(val);
    saveLocal(); render();
  }));
  document.querySelectorAll('[data-act="like-dress"]').forEach((el) => el.addEventListener("click", (e) => {
    e.stopPropagation();
    const id = el.dataset.id;
    const d = vendors.dresses.find((x) => x.id === id);
    if (state.likedDresses[id]) delete state.likedDresses[id];
    else state.likedDresses[id] = { shopName: d.shopName, imageUrl: d.imageUrl };
    saveLocal(); render();
  }));

  const makeLinkBtn = document.getElementById("makeLinkBtn");
  if (makeLinkBtn) makeLinkBtn.addEventListener("click", generateLink);

  document.querySelectorAll('[data-act="makeup-choice"]').forEach((el) => el.addEventListener("click", () => {
    state.makeupChoice = state.makeupChoice === el.dataset.val ? null : el.dataset.val;
    saveLocal(); render();
  }));
  document.querySelectorAll('[data-act="like-makeup"]').forEach((el) => el.addEventListener("click", (e) => {
    e.stopPropagation();
    const id = el.dataset.id;
    const m = vendors.makeup.find((x) => x.id === id);
    if (state.likedMakeup[id]) delete state.likedMakeup[id];
    else state.likedMakeup[id] = { imageUrl: m.imageUrl };
    saveLocal(); render();
  }));

  document.querySelectorAll('[data-act="hair-cat"]').forEach((el) => el.addEventListener("click", () => {
    const val = el.dataset.val;
    state.hairSelection = state.hairSelection.categoryKey === val ? { categoryKey: null, subKey: null } : { categoryKey: val, subKey: null };
    saveLocal(); render();
  }));
  document.querySelectorAll('[data-act="hair-sub"]').forEach((el) => el.addEventListener("click", () => {
    state.hairSelection.subKey = state.hairSelection.subKey === el.dataset.val ? null : el.dataset.val;
    saveLocal(); render();
  }));

  document.querySelectorAll('[data-act="budget-choice"]').forEach((el) => el.addEventListener("click", () => {
    state.budgetChoice = el.dataset.val;
    saveLocal(); render();
  }));

  const noteInput = document.getElementById("noteInput");
  if (noteInput) noteInput.addEventListener("input", () => { state.note = noteInput.value; saveLocal(); });
  const genLinkBtn = document.getElementById("genLinkBtn");
  if (genLinkBtn) genLinkBtn.addEventListener("click", generateLink);
  const copyLinkBtn = document.getElementById("copyLinkBtn");
  if (copyLinkBtn) copyLinkBtn.addEventListener("click", () => {
    const url = location.href.split("?")[0] + "?r=" + state.linkId;
    navigator.clipboard.writeText(url).then(() => showToast("링크가 복사되었어요!"));
  });
}

document.getElementById("prevBtn").addEventListener("click", goPrev);
document.getElementById("nextBtn").addEventListener("click", goNext);

/* ---------------- 조회 모드 (플래너/고객이 링크로 접속 시) ---------------- */

async function tryViewMode() {
  const params = new URLSearchParams(location.search);
  const rid = params.get("r");
  if (!rid) return false;
  document.getElementById("progressWrap").style.display = "none";
  document.getElementById("navRow").style.display = "none";
  document.getElementById("content").innerHTML = `<div class="step" style="padding-top:60px; text-align:center;"><span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></div>`;
  let data = null;
  try {
    if (!window.FIREBASE_READY) throw new Error("no firebase");
    const snap = await db.ref("responses/" + rid).once("value");
    data = snap.val();
  } catch (e) {
    try { data = JSON.parse(localStorage.getItem("heeple_sdme_response_" + rid) || "null"); } catch (_) {}
  }
  if (!data) {
    document.getElementById("content").innerHTML = `<div class="step" style="padding-top:60px; text-align:center;">링크를 찾을 수 없어요. 링크를 다시 확인해주세요.</div>`;
    return true;
  }
  state = Object.assign(defaultState(), data, { linkId: rid });
  document.getElementById("content").innerHTML = buildSummaryHtml(true);
  return true;
}

/* ---------------- 시작 ---------------- */

(async function init() {
  const viewed = await tryViewMode();
  if (viewed) return;
  render();
})();
</script>
